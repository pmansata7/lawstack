# Full production DB deploy on main:
#   1. Supabase SQL (supabase/migrations/)
#   2. Prisma migrate deploy (prisma/migrations/) — needs DIRECT_URL secret
#   3. Row-level security (supabase/rls-policies.sql) via Supabase CLI
#
# Required GitHub Actions secrets:
#   SUPABASE_ACCESS_TOKEN — https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF  — 20-char ref from https://<ref>.supabase.co
#   SUPABASE_DB_PASSWORD  — Database password
#   DIRECT_URL            — Session pooler URI (port 5432); copy from Vercel / Supabase dashboard
#
# Optional:
#   DATABASE_URL — Pooler URI for runtime; Prisma uses DIRECT_URL when set

name: Database deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/rls-policies.sql'
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - 'scripts/ci-database-deploy.mjs'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate Supabase project ref secret
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [[ ! "$SUPABASE_PROJECT_REF" =~ ^[a-z]{20}$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF is invalid (expected exactly 20 lowercase letters)."
            exit 1
          fi

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Push Supabase SQL migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --yes

      - name: Apply RLS policies (Supabase CLI)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase db query --linked -f supabase/rls-policies.sql

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run db:ci-deploy
