# Full production DB deploy on main:
#   1. Supabase SQL (supabase/migrations/)
#   2. Prisma migrate deploy (prisma/migrations/) — needs DIRECT_URL secret
#   3. Row-level security (supabase/rls-policies.sql) via Supabase CLI
#
# Required GitHub Actions secrets:
#   DIRECT_URL — Session pooler URI (port 5432); copy from Vercel / Supabase dashboard
#
# Optional (not used when --db-url is set; kept for manual supabase link locally):
#   SUPABASE_ACCESS_TOKEN — full or scoped PAT with project_admin_read if you use `supabase link`
#   SUPABASE_PROJECT_REF  — 20-char ref from https://<ref>.supabase.co
#   SUPABASE_DB_PASSWORD  — Database password
#
# Optional:
#   DATABASE_URL — Pooler URI (6543); if unset, CI copies DIRECT_URL for Prisma schema validation

name: Database deploy

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/rls-policies.sql'
      - 'prisma/migrations/**'
      - 'prisma/schema.prisma'
      - 'scripts/ci-database-deploy.mjs'
      - '.github/workflows/supabase-migrate.yml'
  workflow_dispatch:

jobs:
  migrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate DIRECT_URL secret
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [[ -z "${DIRECT_URL// }" ]]; then
            echo "::error::Missing DIRECT_URL GitHub Actions secret (Supabase session pooler URI, port 5432)."
            exit 1
          fi

      - name: Push Supabase SQL migrations
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: supabase db push --yes --db-url "$DIRECT_URL"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply RLS policies
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: node scripts/ensure-prisma-env.mjs && npm run db:rls

      - name: Prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: npm run db:ci-deploy
